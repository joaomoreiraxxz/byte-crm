<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="120" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  
  <!-- Sleek Hexagon Base -->
  <polygon points="256,64 422,160 422,352 256,448 90,352 90,160" fill="none" stroke="url(#grad-main)" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Inner Abstract 'B' or Tech Circuit -->
  <path d="M 210 160 v 192 M 210 160 h 60 c 40 0, 50 30, 50 45 c 0 20 -15 40 -40 45 c 30 5 50 25 50 50 c 0 25 -20 52 -60 52 h -60" fill="none" stroke="url(#grad-accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
