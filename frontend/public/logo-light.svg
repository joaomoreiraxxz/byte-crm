<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1121;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050914;stop-opacity:1" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:0.8" />
    </linearGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0EA5E9" flood-opacity="0.4" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Night Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring / Tech Frame -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4" stroke-dasharray="10 15" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="2" />

  <!-- Abstract Waves (Overlapping) -->
  <g filter="url(#shadow)">
    <!-- Back Wave (Teal) -->
    <path d="M 120 300 C 180 200, 280 400, 400 240 C 420 210, 400 350, 350 400 C 250 450, 150 420, 120 300 Z" fill="url(#wave3Grad)" />

    <!-- Middle Wave (Indigo) -->
    <path d="M 140 220 C 200 120, 320 320, 380 180 C 410 120, 380 280, 320 340 C 240 400, 120 320, 140 220 Z" fill="url(#wave2Grad)" />

    <!-- Front Wave (Cyan) - Glows -->
    <path d="M 160 350 C 240 450, 360 250, 420 380 C 380 440, 280 480, 180 420 C 100 360, 120 250, 160 350 Z" fill="url(#wave1Grad)" filter="url(#glow)"/>
    
    <!-- Central Flow (Cyan Core) -->
    <path d="M 170 180 C 230 100, 310 260, 370 150 C 350 250, 270 320, 210 260 C 150 200, 140 230, 170 180 Z" fill="url(#wave1Grad)" />
  </g>
  
  <!-- Subtle Highlighting -->
  <path d="M 256 120 L 256 140 M 256 372 L 256 392 M 120 256 L 140 256 M 372 256 L 392 256" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
</svg>
