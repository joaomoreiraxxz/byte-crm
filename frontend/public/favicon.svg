<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161E31;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1322;stop-opacity:1" />
    </linearGradient>

    <!-- Wave 1 (Deep Purple / Indigo) -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>

    <!-- Wave 2 (Teal / Greenish) -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>

    <!-- Wave 3 (Cyan / Bright Blue) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light Purple for overlapping areas -->
    <linearGradient id="lightPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.9" />
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <g transform="translate(0, 30)">
    <!-- Back Wave (Purple/Indigo) -->
    <path d="M 0 350 C 120 280, 160 380, 256 360 C 350 340, 400 220, 512 250 L 512 400 C 380 320, 300 450, 180 430 C 80 410, 40 450, 0 420 Z" fill="url(#purpleGrad)" />

    <!-- Middle Wave (Teal) -->
    <path d="M 0 280 C 100 280, 150 420, 280 350 C 350 310, 420 280, 512 320 L 512 370 C 450 330, 380 340, 300 400 C 180 480, 100 350, 0 350 Z" fill="url(#tealGrad)" filter="url(#dropShadow)" />

    <!-- Front Wave (Cyan with the curl) -->
    <path d="M 0 270 C 80 230, 120 150, 240 150 C 290 150, 300 200, 260 230 C 220 260, 200 200, 230 180 C 210 200, 210 250, 270 270 C 350 300, 420 200, 512 230 L 512 300 C 400 220, 300 370, 200 350 C 100 330, 50 310, 0 330 Z" fill="url(#cyanGrad)" filter="url(#dropShadow)" />
    
    <!-- Top Highlights / Overlay wave -->
    <path d="M 0 310 C 120 250, 180 350, 280 320 C 380 290, 450 250, 512 280 L 512 320 C 420 270, 350 340, 260 380 C 150 430, 80 320, 0 350 Z" fill="url(#lightPurpleGrad)" style="mix-blend-mode: screen;" opacity="0.6" />
  </g>
</svg>
