version: '3.9'

services:
  # ─── PostgreSQL 16 ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bytecrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytecrm}
      POSTGRES_USER: ${POSTGRES_USER:-bytecrm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytecrm_admin} -d ${POSTGRES_DB:-bytecrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bytecrm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API (Node.js) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytecrm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bytecrm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bytecrm}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AUDIT_ENCRYPTION_KEY: ${AUDIT_ENCRYPTION_KEY}
      VAULT_MASTER_SALT: ${VAULT_MASTER_SALT}
      CSRF_SECRET: ${CSRF_SECRET}
      BIOMETRIC_SERVICE_URL: http://biometric-service:8000
      BIOMETRIC_API_KEY: ${BIOMETRIC_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.bytecrm.online}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Biometric Service (Python FastAPI) ──────────────────────
  biometric-service:
    build:
      context: ./biometric-service
      dockerfile: Dockerfile
    container_name: bytecrm_biometric
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bytecrm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bytecrm}?sslmode=disable
      API_KEY: ${BIOMETRIC_API_KEY}
      EMBEDDING_ENCRYPTION_KEY: ${EMBEDDING_ENCRYPTION_KEY}
      MODEL_NAME: Facenet512
      DETECTION_BACKEND: retinaface
      FACE_MATCH_THRESHOLD: "0.40"
      WORKERS: ${BIO_WORKERS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (Vite build served by Nginx) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytecrm_frontend
    restart: unless-stopped
    networks:
      - frontend-net

  # ─── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bytecrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - biometric-service
    networks:
      - frontend-net
      - backend-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
