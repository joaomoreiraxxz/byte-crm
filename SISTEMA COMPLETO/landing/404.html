<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada | CRM BYTE</title>
    <link rel="icon" type="image/svg+xml" href="logo-light.svg" />
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5%;
            text-align: center;
        }
        .error-content {
            background: rgba(14, 18, 45, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 500px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
            animation: float 6s ease-in-out infinite;
        }
        .error-code {
            font-size: 80px;
            font-weight: 700;
            background: linear-gradient(135deg, #A5B4FC, #4F46E5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            line-height: 1;
        }
        .error-message {
            font-size: 20px;
            color: #fff;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .error-desc {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            line-height: 1.5;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" style="text-decoration: none; color: inherit;">
            <div class="logo">
                <img src="logo-light.svg" alt="CRM BYTE">
                <span>CRM BYTE</span>
            </div>
        </a>
    </header>

    <main class="error-container">
        <div class="error-content reveal active">
            <div class="error-code">404</div>
            <div class="error-message">Página não encontrada</div>
            <div class="error-desc">Parece que você se perdeu no ciberespaço. A página que você está procurando foi movida, excluída ou nunca existiu.</div>
            <a href="/" class="btn-primary">Voltar para o Início</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CRM BYTE. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
